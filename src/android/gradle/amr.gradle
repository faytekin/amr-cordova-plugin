repositories {
    google()
    jcenter()

    maven { url 'https://mvn-repo.admost.com/artifactory/amr-2' }
    maven { url 'https://android-sdk.is.com/' }
    maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
    maven { url 'https://artifact.bytedance.com/repository/pangle' }
}

dependencies {
    implementation 'com.admost.sdk:cordova-plugin:1.2.9'
    implementation 'com.admost.sdk:amr:3.2.7'
    implementation 'com.google.android.gms:play-services-base:18.10.0'
    implementation 'com.admost.sdk:admost-adapter:1.1.9.a49'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.admost.sdk:admob-adapter:24.0.0.5.a49'
    implementation 'com.admost.sdk:applovin-adapter:13.5.1.a49'
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'
    implementation 'com.google.android.gms:play-services-tasks:18.4.1'
    implementation 'com.admost.sdk:facebook-adapter:6.21.0.a49'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'com.admost.sdk:unity-adapter:4.16.6.2.a49'
}

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    defaultConfig {
        minSdkVersion 19
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'assets/*.png'
        exclude 'values/*.xml'
    }
}